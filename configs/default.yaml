# ais-sentinel default configuration. All thresholds live here, not in code.
seed: 20231001

paths:
  models: models           # trained models + validation choices (gitignored)
  raw: data/raw            # transient national downloads (deleted after filtering)
  interim: data/interim    # per-day AOI parquet
  processed: data/processed
  reports: reports
  site_data: site/public/data

region:
  name: Detroit–St. Clair corridor
  lat_min: 41.40
  lat_max: 43.10
  lon_min: -83.60
  lon_max: -82.30

download:
  url_template: "https://coast.noaa.gov/htdata/CMSP/AISDataHandler/{year}/AIS_{year}_{month:02d}_{day:02d}.zip"
  url_templates:           # per-year formats (2024+ is Zstandard-compressed "csv2")
    2024: "https://noaaocm.blob.core.windows.net/ais/csv2/csv{year}/ais-{year}-{month:02d}-{day:02d}.csv.zst"
  start: 2023-05-01
  end: 2023-10-31          # inclusive
  extra_ranges:            # v2 locked test month, one year later (D21)
    - [2024-10-01, 2024-10-31]
  pause_seconds: 5         # politeness delay between files
  timeout_seconds: 600
  keep_raw: false

clean:
  max_sog_kn: 102.2        # 102.3 = not available
  max_implied_speed_kn: 60 # hard data-error gate during cleaning (detector uses its own)

segment:
  max_gap_min: 30          # a gap longer than this ends a voyage
  min_points: 10
  min_duration_min: 30

splits:                    # inclusive UTC dates; days between splits are buffers
  train: [2023-05-01, 2023-08-31]
  val: [2023-09-02, 2023-09-30]
  test: [2023-10-02, 2023-10-31]

tracking:
  workers: 4               # parallel processes for the track stage
  # Values below come from the real-data calibration stage (tracking/calibrate.py, D20):
  # one-step predictive likelihood on training voyages; edge values were confirmed by a
  # local refinement. Earlier simulation-tuned values: reports/tracking_attempt1.md, D19.
  cv:
    q_accel: 3.0e-05         # white-noise acceleration PSD [m^2/s^3]
    r_pos_m: 5.0            # position measurement std [m]
    gate_prob: 0.9999       # chi-square outlier gate
  imm:
    r_pos_m: 1.5
    q_stationary: 1.0e-04
    tau_stationary_s: 30.0
    q_cruise: 1.0e-04
    q_turn: 0.02
    q_omega: 2.0e-08
    sojourn_s: [1800.0, 600.0, 300.0]
    clutter_density: 5.0e-11  # outlier density per m^2 (likelihood-ratio test)
    gap_q: 0.0             # gap-aware process noise (both filters chose 0 on real data)
    gap_s: 180.0
  gate_prob: 0.999         # default gate if a filter does not set its own
  max_consecutive_rejects: 2
  sim:                     # simulation study (tracking/sim_study.py); half-open seed ranges
    tune_seeds: [0, 50]
    # Attempt 3 (D20): "fixed" mode evaluates the real-data-calibrated simulator and filter
    # parameters unchanged on fresh seeds. Attempt 1 used seeds 100-300, attempt 2 1000-1200.
    eval_seeds: [3000, 3200]  # attempt 4 (D21); attempt 3 used 2000-2200
    mode: fixed
    calibration_file: reports/tracking_calibration.json
  calibration:               # tracking/calibrate.py (training split only)
    n_voyages: 150

prediction:
  horizons_min: [15, 30, 60, 120]
  history_min: 60
  anchor_every_min: 10      # evaluation anchors (val/test)
  min_sog_kn: 2.0           # evaluate underway vessels only (DECISIONS D9)
  n_boot: 1000
  knn:                      # tuned on validation (dev run picked the old grid's edges: widened)
    pos_scale_m: [600, 1200, 2500]
    course_scale_deg: [20, 30, 45]
    k: [20, 40, 80]
  ml:
    train_anchor_every_min: 6   # compute budget (DECISIONS D16)
    hidden: 64
    layers: 1
    mlp: 128
    dropout: 0.1
    lr: 0.002
    batch: 512
    max_epochs: 20
    patience: 3
    threads: 4
    mdn_components: 3
    seeds_gaussian: [0, 1, 2]
    seeds_mdn: [0, 1]

anomaly:
  context:                 # learned from the training split
    reception_cell_m: 2000.0
    port_cell_m: 500.0
    traffic_cell_m: 500.0
    port_min_vessel_hours: 12.0
    port_min_vessels: 3
    course_min_fixes: 20
  gap:
    min_gap_min: 30
    min_sog_kn: 1.0
    edge_buffer_km: 3.0
    min_reception: 0.8     # both ends must be in cells with >= 80% normal reception
    max_gap_h: 24.0        # longer silences are parked vessels, not "going dark" in transit
  jump:
    min_jump_m: 1000.0
    abs_kn: 40.0
    sog_factor: 2.0
    sog_margin_kn: 10.0
  loiter:
    max_sog_kn: 2.0
    min_hours: 2.0
    max_port_frac: 0.2
    max_gap_min: 30.0
  deviation:
    min_sog_kn: 3.0
    max_cell_voyages: 2
    min_course_prob: 0.02
    min_cell_voyages_for_course: 10
    min_minutes: 10.0
    max_gap_min: 5.0
  rendezvous:
    max_dist_m: 500.0
    max_sog_kn: 2.0
    min_hours: 1.0
    bin_min: 5.0
  eval:
    n_per_type: 300
    min_voyage_min: 120    # injection pool: commercial test voyages at least this long

export:
  n_showcase: 16
  n_predictions: 40        # seeded random draw of commercial test samples
  n_events_per_type: 15    # top-scoring commercial events per anomaly type
  case_studies: configs/case_studies.yaml
  tracking_note: >-
    Three attempts, all reported (DECISIONS D15, D19, D20). The numbers above are attempt 3.
    The simulator was recalibrated to real ship behaviour, and both filters' noise was fitted
    to real training data by one-step predictive likelihood. In this realistic simulator a
    Kalman filter tuned for accuracy tracks gentle real manoeuvres as well as the IMM (both
    1.4 m RMSE). The IMM's straight-leg RMSE comes from two fixes after 20-minute gaps.
    On real data the IMM predicts each next fix far better than the Kalman filter (mean
    log-likelihood -7.4 against -10.4 per fix) and is closer to consistent (NIS 1.6%, up from
    0.9%; target 2-10%). The website's tracks and the prediction baselines use the attempt-1
    filter settings.
