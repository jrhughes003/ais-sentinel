# ais-sentinel default configuration. All thresholds live here, not in code.
seed: 20231001

paths:
  models: models           # trained models + validation choices (gitignored)
  raw: data/raw            # transient national downloads (deleted after filtering)
  interim: data/interim    # per-day AOI parquet
  processed: data/processed
  reports: reports
  site_data: site/public/data

region:
  name: Detroit–St. Clair corridor
  lat_min: 41.40
  lat_max: 43.10
  lon_min: -83.60
  lon_max: -82.30

download:
  url_template: "https://coast.noaa.gov/htdata/CMSP/AISDataHandler/{year}/AIS_{year}_{month:02d}_{day:02d}.zip"
  start: 2023-05-01
  end: 2023-10-31          # inclusive
  pause_seconds: 5         # politeness delay between files
  timeout_seconds: 600
  keep_raw: false

clean:
  max_sog_kn: 102.2        # 102.3 = not available
  max_implied_speed_kn: 60 # hard data-error gate during cleaning (detector uses its own)

segment:
  max_gap_min: 30          # a gap longer than this ends a voyage
  min_points: 10
  min_duration_min: 30

splits:                    # inclusive UTC dates; days between splits are buffers
  train: [2023-05-01, 2023-08-31]
  val: [2023-09-02, 2023-09-30]
  test: [2023-10-02, 2023-10-31]

tracking:
  workers: 4               # parallel processes for the track stage
  # Values below were chosen by the simulation study (reports/tracking.md), not by hand.
  cv:
    q_accel: 0.1            # white-noise acceleration PSD [m^2/s^3]
    r_pos_m: 10.0            # position measurement std [m]
    gate_prob: 0.9999       # chi-square outlier gate
  imm:
    r_pos_m: 10.0
    q_stationary: 0.0001
    tau_stationary_s: 30.0
    q_cruise: 0.002
    q_turn: 0.2
    q_omega: 2.0e-07
    sojourn_s: [1800.0, 600.0, 300.0]
    clutter_density: 5.0e-11  # outlier density per m^2 (likelihood-ratio test)
  gate_prob: 0.999         # default gate if a filter does not set its own
  max_consecutive_rejects: 2
  sim:                     # simulation study (tracking/sim_study.py); half-open seed ranges
    tune_seeds: [0, 50]
    eval_seeds: [100, 300]

prediction:
  horizons_min: [15, 30, 60, 120]
  history_min: 60
  anchor_every_min: 10      # evaluation anchors (val/test)
  min_sog_kn: 2.0           # evaluate underway vessels only (DECISIONS D9)
  n_boot: 1000
  knn:                      # tuned on validation
    pos_scale_m: [300, 600, 1200]
    course_scale_deg: [15, 30]
    k: [10, 30]
  ml:
    train_anchor_every_min: 3
    hidden: 64
    layers: 1
    mlp: 128
    dropout: 0.1
    lr: 0.002
    batch: 512
    max_epochs: 30
    patience: 4
    threads: 4
    mdn_components: 3
    seeds_gaussian: [0, 1, 2, 3, 4]
    seeds_mdn: [0, 1, 2]

anomaly:
  context:                 # learned from the training split
    reception_cell_m: 2000.0
    port_cell_m: 500.0
    traffic_cell_m: 500.0
    port_min_vessel_hours: 12.0
    port_min_vessels: 3
    course_min_fixes: 20
  gap:
    min_gap_min: 30
    min_sog_kn: 1.0
    edge_buffer_km: 3.0
    min_reception: 0.8     # both ends must be in cells with >= 80% normal reception
  jump:
    min_jump_m: 1000.0
    abs_kn: 40.0
    sog_factor: 2.0
    sog_margin_kn: 10.0
  loiter:
    max_sog_kn: 2.0
    min_hours: 2.0
    max_port_frac: 0.2
    max_gap_min: 30.0
  deviation:
    min_sog_kn: 3.0
    max_cell_voyages: 2
    min_course_prob: 0.02
    min_cell_voyages_for_course: 10
    min_minutes: 10.0
    max_gap_min: 5.0
  rendezvous:
    max_dist_m: 500.0
    max_sog_kn: 2.0
    min_hours: 1.0
    bin_min: 5.0
  eval:
    n_per_type: 300
    min_voyage_min: 120    # injection pool: commercial test voyages at least this long

export:
  n_showcase: 16
